name: Release

# 触发：打 v* 标签自动发版；也可在 Actions 页面手动 Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========== 桌面版：macOS(.dmg/.app) + Windows(NSIS .exe 安装包) ==========
  # 说明：WiX/MSI 不支持中文软件名（light.exe 会失败），故 Windows 只出 NSIS 安装包
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.2

      - name: "构建安装包（Windows: 仅 NSIS .exe）"
        if: runner.os == 'Windows'
        run: tauri build --bundles nsis

      - name: "构建安装包（macOS: .app + .dmg）"
        if: runner.os == 'macOS'
        run: tauri build

      - name: 规范产物文件名（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          B=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/dmg/*.dmg; do cp "$f" "release-artifacts/鸿升飞书-${VER}-macOS-arm64.dmg"; done
          for f in "$B"/macos/*.app.tar.gz; do cp "$f" "release-artifacts/鸿升飞书-${VER}-macOS-arm64.app.tar.gz"; done
          ls -la release-artifacts

      - name: 规范产物文件名（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          B=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/nsis/*-setup.exe; do cp "$f" "release-artifacts/鸿升飞书-${VER}-windows-x64-setup.exe"; done
          ls -la release-artifacts

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*

  # ========== 安卓版：.apk（适配华为等机型，旁加载安装）==========
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链（含安卓目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # 手动安装 Android SDK（android-actions/setup-android 的 sdkmanager tools 已失效）
      # 注意：API 37 的平台包名是 platforms;android-37.0（SDK 新版本号规则）
      - name: 安装 Android SDK（cmdline-tools + 平台 + 构建工具）
        shell: bash
        run: |
          set -eu
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 5 -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # 关键：ubuntu runner 预置了指向旧 SDK 的 ANDROID_SDK_ROOT，
          # 与我们的 ANDROID_HOME 不一致会导致 AGP 报错，必须同步覆盖
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          for p in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "$p" || echo "跳过不可用的包: $p"
          done

      - name: 设置 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.2

      - name: 初始化 Android 工程
        run: tauri android init --ci
        env:
          CI: "true"

      - name: 构建 APK（arm64 + armv7，debug 签名可直接安装）
        run: tauri android build --apk --debug --target aarch64 --target armv7 --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CI: "true"

      - name: 整理 APK 文件名
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-apk
          for f in $(find src-tauri/gen/android -name "*.apk"); do
            case "$f" in
              *aarch64*|*arm64*) dst="鸿升飞书-${VER}-android-arm64.apk" ;;
              *armv7*|*armeabi*) dst="鸿升飞书-${VER}-android-armv7.apk" ;;
              *) dst="鸿升飞书-${VER}-android.apk" ;;
            esac
            cp "$f" "release-apk/$dst"
            echo "打包: $dst"
          done
          ls -la release-apk

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
