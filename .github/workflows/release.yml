name: Release

# 触发：打 v* 标签自动发版；也可在 Actions 页面手动 Run workflow
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========== 桌面版：macOS(.dmg/.app) + Windows(NSIS .exe 安装包) ==========
  # 说明：WiX/MSI 不支持中文软件名（light.exe 会失败），故 Windows 只出 NSIS 安装包
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装 Tauri CLI
        run: npm install -g @tauri-apps/cli@2.12.2

      - name: "构建安装包（Windows: 仅 NSIS .exe）"
        if: runner.os == 'Windows'
        run: tauri build --bundles nsis

      - name: "构建安装包（macOS: .app + .dmg）"
        if: runner.os == 'macOS'
        run: tauri build

      - name: 规范产物文件名（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          B=src-tauri/target/release/bundle
          shopt -s nullglob
          # 注意：GitHub Release 的资产文件名不支持中文（非 ASCII 字符会被平台剥离，
          # 导致下载文件丢失软件名），故统一使用拼音 ASCII 命名；
          # 安装后软件名称仍为「鸿升飞书」
          for f in "$B"/dmg/*.dmg; do cp "$f" "release-artifacts/HongshengFeishu-${VER}-macOS-arm64.dmg"; done
          for f in "$B"/macos/*.app.tar.gz; do cp "$f" "release-artifacts/HongshengFeishu-${VER}-macOS-arm64.app.tar.gz"; done
          ls -la release-artifacts

      - name: 规范产物文件名（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-artifacts
          B=src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$B"/nsis/*-setup.exe; do cp "$f" "release-artifacts/HongshengFeishu-${VER}-windows-x64-setup.exe"; done
          ls -la release-artifacts

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*
          body: |
            ## 鸿升飞书 v1.0.1 —— macOS / Windows / Android 三平台

            开发者：鸿升周老师 ｜ 通信协议：HSFP（同一局域网自动发现，功能对标飞鸽传书）

            ### 安装包下载

            | 安装包 | 适用平台 | 安装方式 |
            | --- | --- | --- |
            | `HongshengFeishu-1.0.1-macOS-arm64.dmg` | macOS（Apple Silicon：M1/M2/M3/M4 等） | 双击打开磁盘映像，将「鸿升飞书」拖入「应用程序」文件夹 |
            | `HongshengFeishu-1.0.1-windows-x64-setup.exe` | Windows 10 / 11（64 位） | 双击运行安装程序，按提示完成安装 |
            | `HongshengFeishu-1.0.1-android.apk` | Android 8.0 及以上（arm64 / armeabi，含华为等机型） | 下载到手机后点击安装（旁加载） |

            > 说明：GitHub 的下载文件名不支持中文，故安装包使用拼音命名；安装完成后，设备上显示的软件名称仍为「鸿升飞书」。

            ### 华为手机安装 APK 步骤

            1. 将 `HongshengFeishu-1.0.1-android.apk` 下载到手机（或用数据线、微信文件传输助手传到手机）；
            2. 进入「设置 → 安全 → 更多安全设置」，允许「外部来源应用下载」；
            3. 点击 APK 文件，如弹出「未知应用」提示，按指引允许本次安装；
            4. 打开「鸿升飞书」，确保手机与电脑连接同一 Wi-Fi，即可自动发现好友，互传文字、文件与文件夹。

            ### 使用提示

            - 手机与电脑必须在**同一局域网（同一 Wi-Fi）**内才能自动发现彼此；
            - 支持文字消息、单文件、整文件夹传输；
            - 若列表中找不到对方，请检查防火墙是否放行本软件，或双方重启软件重试。
          # 新版 GitHub 平台限制 GITHUB_TOKEN 更新 Release，需用 PAT；
          # 未配置 RELEASE_TOKEN secret 时回退到 GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # ========== 安卓版：.apk（适配华为等机型，旁加载安装）==========
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Rust 工具链（含安卓目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # 手动安装 Android SDK（android-actions/setup-android 的 sdkmanager tools 已失效）
      # 注意：API 37 的平台包名是 platforms;android-37.0（SDK 新版本号规则）
      - name: 安装 Android SDK（cmdline-tools + 平台 + 构建工具）
        shell: bash
        run: |
          set -eu
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 5 -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # 关键：ubuntu runner 预置了指向旧 SDK 的 ANDROID_SDK_ROOT，
          # 与我们的 ANDROID_HOME 不一致会导致 AGP 报错，必须同步覆盖
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          for p in "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "$p" || echo "跳过不可用的包: $p"
          done

      - name: 设置 Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      # 必须本地安装 @tauri-apps/cli 并通过 npm 调用：
      # 1) tauri CLI 会检测调用它的包管理器，直接调用全局二进制会生成
      #    "node tauri ..." 版 BuildTask.kt，导致安卓构建报
      #    Cannot find module '.../src-tauri/tauri'
      # 2) gradle 构建时 BuildTask 会执行 npm run -- tauri ...，
      #    需要仓库根目录 node_modules/.bin/tauri 存在
      - name: 安装依赖（含本地 Tauri CLI）
        run: npm install --no-audit --no-fund

      - name: 初始化 Android 工程
        run: npm run tauri -- android init --ci
        env:
          CI: "true"

      - name: 构建 APK（arm64 + armv7，debug 签名可直接安装）
        run: npm run tauri -- android build --apk --debug --target aarch64 --target armv7 --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CI: "true"

      - name: 整理 APK 文件名
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p release-apk
          for f in $(find src-tauri/gen/android -name "*.apk"); do
            case "$f" in
              *aarch64*|*arm64*) dst="HongshengFeishu-${VER}-android-arm64.apk" ;;
              *armv7*|*armeabi*) dst="HongshengFeishu-${VER}-android-armv7.apk" ;;
              *) dst="HongshengFeishu-${VER}-android.apk" ;;
            esac
            cp "$f" "release-apk/$dst"
            echo "打包: $dst"
          done
          ls -la release-apk

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release-apk/*.apk
          body: |
            ## 鸿升飞书 v1.0.1 —— macOS / Windows / Android 三平台

            开发者：鸿升周老师 ｜ 通信协议：HSFP（同一局域网自动发现，功能对标飞鸽传书）

            ### 安装包下载

            | 安装包 | 适用平台 | 安装方式 |
            | --- | --- | --- |
            | `HongshengFeishu-1.0.1-macOS-arm64.dmg` | macOS（Apple Silicon：M1/M2/M3/M4 等） | 双击打开磁盘映像，将「鸿升飞书」拖入「应用程序」文件夹 |
            | `HongshengFeishu-1.0.1-windows-x64-setup.exe` | Windows 10 / 11（64 位） | 双击运行安装程序，按提示完成安装 |
            | `HongshengFeishu-1.0.1-android.apk` | Android 8.0 及以上（arm64 / armeabi，含华为等机型） | 下载到手机后点击安装（旁加载） |

            > 说明：GitHub 的下载文件名不支持中文，故安装包使用拼音命名；安装完成后，设备上显示的软件名称仍为「鸿升飞书」。

            ### 华为手机安装 APK 步骤

            1. 将 `HongshengFeishu-1.0.1-android.apk` 下载到手机（或用数据线、微信文件传输助手传到手机）；
            2. 进入「设置 → 安全 → 更多安全设置」，允许「外部来源应用下载」；
            3. 点击 APK 文件，如弹出「未知应用」提示，按指引允许本次安装；
            4. 打开「鸿升飞书」，确保手机与电脑连接同一 Wi-Fi，即可自动发现好友，互传文字、文件与文件夹。

            ### 使用提示

            - 手机与电脑必须在**同一局域网（同一 Wi-Fi）**内才能自动发现彼此；
            - 支持文字消息、单文件、整文件夹传输；
            - 若列表中找不到对方，请检查防火墙是否放行本软件，或双方重启软件重试。
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
