[package]
name = "hongsheng-feishu"
version = "1.0.0"
description = "鸿升飞书 - 局域网即时通讯与文件传输"
authors = ["鸿升周老师"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "hongsheng_feishu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hongsheng-feishu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = "0.6"

[profile.release]
opt-level = 2
lto = true
strip = true
