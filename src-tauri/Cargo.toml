[package]
name = "hongsheng-feishu"
version = "1.2.1"
description = "鸿升飞书 - 局域网即时通讯与文件传输"
authors = ["鸿升周老师"]
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "hongsheng_feishu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hongsheng-feishu"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# 显式声明 gtk3 feature（当前已是默认值，显式写出以防上游默认变更）：
# Linux 桌面使用 GTK 原生对话框，避免部分环境 xdg-desktop-portal 后端缺失导致选择器无法弹出
tauri-plugin-dialog = { version = "2", features = ["gtk3"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = "0.6"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = true
strip = true

# 安卓 debug 包同样剥离符号，显著减小 APK 体积（不影响 JNI 导出符号）
[profile.dev]
strip = "symbols"
