<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聊天 · 鸿升飞书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="chatRoot" style="height: 100vh; display: flex; flex-direction: column"></div>
    <script src="common.js"></script>
    <script src="chat.js"></script>
    <script>
      (function () {
        const uid = new URLSearchParams(location.search).get("uid") || "";
        if (!uid) {
          document.body.innerHTML =
            '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#999">缺少联系人参数</div>';
          return;
        }
        const root = document.getElementById("chatRoot");
        const chat = window.HSFChat.createChat(root, uid, { embedded: false });
        // 窗口标题跟随联系人
        HSF.invoke("list_peers").then((peers) => {
          const p = peers.find((x) => x.uid === uid);
          if (p) {
            const dn = p.alias || p.nick || p.host || "聊天";
            document.title = `与 ${dn} 聊天 · 鸿升飞书`;
          }
        });
        // 聊天窗口内的文件接收确认
        HSF.listen("file-offer", (ev) => {
          const o = ev.payload || {};
          if (o.from !== uid) return;
          HSF.fileOfferModal(o).then((v) => {
            const accept = v === "accept";
            HSF.invoke("respond_offer", {
              transferId: o.transfer_id,
              accept,
              savePath: null,
            }).catch(() => {});
          });
        });
      })();
    </script>
  </body>
</html>
