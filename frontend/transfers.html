<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>传输管理 · 鸿升飞书</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="settings">
      <header class="titlebar">
        <div class="traffic">
          <button class="tl-close" id="tlClose" title="关闭"></button>
          <button class="tl-min" id="tlMin" title="最小化"></button>
        </div>
        <div class="win-title">
          <span class="brand-mark">飞</span>
          传输管理
          <span class="t-sub" id="trSummary"></span>
        </div>
        <div class="spacer"></div>
        <button class="tool-btn icon-only" id="trRefresh" title="刷新">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </header>

      <div class="transfers-body" id="trBody">
        <div class="tr-empty">暂无传输记录</div>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="transfers.js"></script>
  </body>
</html>
